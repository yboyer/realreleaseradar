name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    name: release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - id: release
        shell: bash
        run: |
          export LC_ALL=C
          tags_before=$(mktemp)
          trap 'rm -f "$tags_before"' EXIT
          git tag --list | sort > "$tags_before"
          npx --yes --package=semantic-release@26.0.1 --package=@yboyer/semantic-release-config@1.0.0 --package=@semantic-release/git@11.0.1 -c '
            mkdir -p node_modules/@yboyer &&
            ln -s "$(dirname "$(command -v semantic-release)")/../@yboyer/semantic-release-config" node_modules/@yboyer/semantic-release-config &&
            semantic-release
          '
          tag=$(comm -13 "$tags_before" <(git tag --list | sort))
          if [[ "$tag" == *$'\n'* ]]; then
            echo "Expected at most one new release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_REF: refs/tags/${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build and publish
        uses: yboyer/actions/docker-publish@09809ba4aef750373e8e258c96d5150d713bcc34 # v1.6.0
        with:
          image: ghcr.io/yboyer/realreleaseradar
          dockerfile: Dockerfile
          cache: true
